    <title>Inventarios Luft · Administración</title>
    <style>
      /* ================================================================
         Paleta oscura vintage.

         La referencia no es una pantalla, es un objeto: un libro de cuentas
         encuadernado en piel, en un despacho con poca luz. Fondo de espresso
         —caliente, nunca negro puro ni azulado—, texto de papel envejecido, y
         UN acento, que cambia con la division: dorado en carpinteria, el azul
         de la marca en cancelaria.

         Por que un acento y no varios: lo caro se reconoce por lo que se quita,
         no por lo que se anade. Un tablero con seis colores compitiendo se lee
         barato por mucho que cada color este bien elegido.

         Ni el dorado ni el azul se parecen al rojo de rechazar ni al verde de
         aprobar, y eso no es casualidad: esos dos colores SOLO significan eso.
         El dia que alguien dude de si un boton aprueba o cancela, el problema
         dejo de ser estetico.

         Contrastes verificados sobre la superficie de las tarjetas: todos los
         colores de texto pasan de 4.5:1.
         ================================================================ */
      :root {
        color-scheme: dark;

        /* --- Superficies, de mas hundida a mas elevada --- */
        --papel: #15110d;
        --superficie: #1f1913;
        --superficie-alta: #26201a;

        /* --- Tinta sobre papel envejecido --- */
        --tinta: #f2e8d5;
        --tinta-tenue: #b9a98f;
        --tinta-debil: #9c8b72;

        /* ============================================================
           EL ACENTO CAMBIA CON LA DIVISION

           Carpinteria va en dorado; cancelaria, en el azul de la marca.
           Es la unica cosa que cambia entre las dos: el resto del sistema
           —fondo, tinta, filetes, estados— es identico, para que nadie dude
           de si esta mirando la misma plataforma.

           Cuatro variables, no una, y la razon importa:

             --acento          para TEXTO y filetes sobre el fondo oscuro
             --acento-relleno  para RELLENOS (botones, pastilla activa)
             --sobre-acento    el texto que va ENCIMA de ese relleno
             --acento-suave    el tinte de fondo de las pastillas

           El azul de la marca, #003366, es magnifico como relleno con texto
           claro encima (10.4:1) e ILEGIBLE como texto sobre el fondo oscuro
           (1.4:1, hace falta 4.5). Por eso el texto usa un azul aclarado del
           mismo tono. Un color de marca no se cambia; se le busca el sitio
           donde funciona.

           Ojo con la asimetria: sobre dorado el texto va oscuro, y sobre azul
           marino va claro. Fijar uno solo dejaria ilegible la mitad de los
           botones.
           ============================================================ */

        /* Por omision, dorado. */
        --acento: #c8a44d;
        --acento-relleno: #c8a44d;
        --acento-fuerte: #a88536;
        --acento-suave: rgba(200, 164, 77, 0.12);
        --sobre-acento: #15110d;

        --madera: #c08552;

        /* --- El filete. En oscuro la sombra casi no separa: lo que separa es
               una linea calida de un pixel y un relleno un punto mas claro. --- */
        --linea: rgba(242, 232, 213, 0.1);
        --linea-fuerte: rgba(242, 232, 213, 0.17);

        /* --- Estado. Nunca viajan solos: siempre con texto. --- */
        --aprobar: #7fa05a;
        --rechazar: #ce6b52;
        --aviso-texto: #d9a441;
        --aviso-fondo: rgba(217, 164, 65, 0.1);
        --aviso-linea: rgba(217, 164, 65, 0.22);

        /* Sombras calidas, con cuerpo de marron y no de azul. */
        --sombra-suave: 0 2px 10px rgba(0, 0, 0, 0.4);
        --sombra-media: 0 10px 30px rgba(0, 0, 0, 0.5);

        /* --- Tipografia ---
           Una serif de alto contraste para titulos y cifras. Es lo que separa
           una pantalla cara de una barata: la sans del sistema esta en todas
           partes, una serif editorial no. Didot y Bodoni existen en Mac; en
           Windows cae en Georgia, que sigue teniendo el mismo caracter.

           El texto corrido y las tablas se quedan en la sans del sistema: una
           serif en una tabla densa de codigos se lee peor, y aqui la legibilidad
           manda sobre el gusto. */
        --serif: 'Didot', 'Bodoni MT', 'Hoefler Text', Georgia, 'Times New Roman', serif;
        --sans: -apple-system, BlinkMacSystemFont, 'SF Pro Text',
          'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif;
      }

      /* ================================================================
         LA DIVISION PONE EL METAL, LA SECCION LO MODULA

         Dos ejes, y cada uno manda sobre una cosa distinta:

           La DIVISION fija el relleno de los botones y el texto que va encima.
           Es identidad de marca y no se mueve: el boton de aprobar se ve igual
           en las cuatro secciones, porque es el mismo acto.

           La SECCION cambia el tono del texto, los filetes y las pestanas,
           dentro de la MISMA familia de color. Nunca se ven dos secciones a la
           vez, asi que esto no produce un arcoiris: produce la sensacion de
           cambiar de sala dentro de la misma casa.

         Los ocho tonos estan verificados: todos pasan de 4.5:1 sobre la
         superficie, y ninguno se acerca en tono al verde de aprobar (88°) ni al
         rojo de rechazar (12°). Los dorados viven en 42-45° y los azules en
         211-212°. Esa distancia no es casual: es lo que impide que un acento se
         confunda con un estado.
         ================================================================ */

      /* --- Cancelaria: el azul de la marca --- */

        --acento: #6ba3e5;
        /* El azul de la marca, tal cual, donde de verdad luce: como relleno. */
        --acento-relleno: #003366;
        --acento-fuerte: #4e86c7;
        --acento-suave: rgba(107, 163, 229, 0.13);
        /* Sobre el marino, texto CLARO: 10.4:1. */

      /* El cambio de sala se hace despacio: si el color saltara de golpe se
         sentiria como un parpadeo, no como un traslado. */
      :root { transition: none; }
      body, body * {
        transition-property: color, background-color, border-color;
        transition-duration: 0.45s;
        transition-timing-function: ease;
      }

      /* ================================================================
         LA FIRMA

         El PNG lleva SOLO el trazo, en blanco y con transparencia. No se pinta:
         se usa como recorte (`mask`), y lo que se ve por debajo es un degradado.
         Por eso el mismo archivo sirve para el oro y para el diamante, y por eso
         se puede cambiar el acabado sin volver a exportar nada.

         Que hace que un metal parezca metal: no es un color, son BANDAS. El oro
         real alterna bronce oscuro, oro vivo y champan casi blanco, porque la
         superficie curva refleja el entorno a trozos. Un degradado de dos paradas
         se ve como plastico amarillo; con siete, se ve como oro.

         El diamante es lo mismo en frio: blanco puro, azul de hielo y un
         apunte de celeste, con los saltos mas bruscos —una piedra tallada
         refleja en aristas, no en curvas.
         ================================================================ */
      /* La firma tambien cambia de material con la division: oro en
         carpinteria, diamante en cancelaria. Va junto al resto —titulos,

        /* ============================================================
           EL METAL SE DERIVA DEL ACENTO

           No hay una rampa dorada y otra azul escritas a mano: las dos se
           construyen a partir de `--acento` con `color-mix`. La consecuencia es
           la que importa —el metal sigue solo a la division Y a la seccion, sin
           ocho definiciones que mantener y sin que se puedan desincronizar.

           La parada mas oscura se queda en el 82% del acento. Bajar mas da un
           metal mas dramatico y deja partes de una palabra por debajo del
           contraste legible: verificado en las ocho combinaciones, el peor caso
           —cancelaria en salidas— da 3.3:1, que vale para texto grande y solo
           para texto grande. Por eso el metal se usa en titulos y cifras de
           24px o mas, nunca en texto corrido. Por eso las cifras de la tabla
           de inventario NO llevan metal: van a 17px y quedarian por debajo del
           limite, y a ochenta y siete renglones el metal ademas estorba para
           recorrer la columna.
           ============================================================ */
        --metal-texto: linear-gradient(100deg,
          color-mix(in srgb, var(--acento) 82%, #000) 0%,
          color-mix(in srgb, var(--acento) 45%, #fff) 17%,
          var(--acento) 33%,
          color-mix(in srgb, var(--acento) 12%, #fff) 51%,
          color-mix(in srgb, var(--acento) 58%, #fff) 69%,
          color-mix(in srgb, var(--acento) 85%, #000) 87%,
          color-mix(in srgb, var(--acento) 48%, #fff) 100%);

        /* El filete no se lee: aqui si va el rango entero, que es lo que hace
           que una linea de un pixel parezca una incrustacion de metal. */
        --metal-filete: linear-gradient(90deg,
          color-mix(in srgb, var(--acento) 26%, #000) 0%,
          var(--acento) 13%,
          color-mix(in srgb, var(--acento) 8%, #fff) 23%,
          color-mix(in srgb, var(--acento) 70%, #000) 37%,
          color-mix(in srgb, var(--acento) 20%, #000) 50%,
          color-mix(in srgb, var(--acento) 52%, #fff) 63%,
          #ffffff 75%,
          color-mix(in srgb, var(--acento) 55%, #000) 89%,
          color-mix(in srgb, var(--acento) 26%, #000) 100%);
      }


      /* La firma ya viene renderizada con su material: aqui solo se coloca.
         Nada de `mask` ni de degradados —el volumen, el reflejo y el brillo se
         calcularon pixel a pixel en `scripts/render-firma.py`. */
      .firma {
        display: block;
        aspect-ratio: 360 / 199;
        background-image: var(--firma);
        background-repeat: no-repeat;
        background-size: contain;
        background-position: center;
        /* La pieza devuelve luz a lo que la rodea. Sin esto se ve pegada
           encima; con esto, apoyada. */
        filter: drop-shadow(0 0 9px rgba(226, 190, 110, 0.28));
        transition: filter 0.45s ease;
      }
      :root[data-division='pvc'] .firma {
        /* Halo frio para el diamante, calido para el oro. La pieza no solo
           recibe luz: devuelve luz a lo que la rodea. */
        filter: drop-shadow(0 0 10px rgba(206, 232, 255, 0.34));
      }

      /* La espera. Sin peso propio: son dos elementos y ninguna imagen que
         no estuviera ya en la hoja. */
      .arranque {
        min-height: 100vh;
        display: grid;
        place-items: center;
        align-content: center;
        gap: 18px;
        padding: 24px;
      }
      .arranque-texto {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--tinta-debil);
        animation: respirar 1.9s ease-in-out infinite;
      }
      /* El latido del panel. Muy contenido: es un indicio, no una alarma. */
      @keyframes pulso {
        0%, 100% { opacity: 1;    transform: scale(1); }
        50%      { opacity: 0.35; transform: scale(0.82); }
      }

      @keyframes respirar {
        0%, 100% { opacity: 0.35; }
        50%      { opacity: 0.9; }
      }

      /* Un hilo de metal, del ancho de un pelo. Es el remate de un mueble
         bueno: no se mira, se nota. */
      .filete-metal {
        height: 1px;
        background-image: var(--metal-filete);
        opacity: 0.75;
      }

      /* ---------------- La firma en la cabecera ----------------
         Junto al nombre de quien esta dentro, no flotando en una esquina. Ahi
         es donde se lee sin buscarla, y donde acompana en vez de estorbar. */
      .marca-cabecera {
        display: flex;
        align-items: center;
        gap: 11px;
        padding-left: 16px;
        border-left: 1px solid var(--acento-suave);
        transition: border-color 0.45s ease;
      }
      .marca-cabecera .firma { width: 52px; }
      .marca-cabecera .rotulo { font-size: 9.5px; letter-spacing: 0.16em; }

      @media (max-width: 720px) {
        .marca-cabecera { border-left: none; padding-left: 0; }
        .marca-cabecera .rotulo { display: none; }
      }

      * { box-sizing: border-box; }

      html, body, #root { height: 100%; }

      body {
        margin: 0;
        background: var(--papel);
        color: var(--tinta);
        font-family: var(--sans);
        font-size: 15px;
        line-height: 1.55;
        letter-spacing: -0.006em;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      /* Los titulos van en serif, grandes y apretados. Es la voz de la marca:
         donde antes habia una sans mas gruesa, ahora hay una letra con historia. */
      h1, h2, h3 {
        font-family: var(--serif);
        font-weight: 400;
        letter-spacing: -0.02em;
        text-wrap: balance;
      }

      h1 { font-size: 34px; line-height: 1.12; margin: 0 0 6px; }
      h2 { font-size: 25px; line-height: 1.18; margin: 0 0 4px; }
      h3 { font-size: 19px; line-height: 1.25; margin: 0; }

      /* Los titulos van labrados en el metal de la division.
         El color plano se declara ANTES: si un navegador no soporta recortar el
         fondo al texto, se queda con el color y el titulo se lee igual. Al
         reves —transparente primero— el titulo desapareceria. */
      h1, h2 {
        color: var(--acento);
      }
      @supports (-webkit-background-clip: text) or (background-clip: text) {
        h1, h2 {
          background-image: var(--metal-texto);
          -webkit-background-clip: text;
          background-clip: text;
          color: transparent;
        }
      }

      /* Las cifras tambien en serif y con los digitos alineados: una columna de
         cantidades que baila se lee como una hoja de calculo cualquiera. */
      .num { font-variant-numeric: tabular-nums; }
      .cifra {
        font-family: var(--serif);
        font-variant-numeric: tabular-nums;
        letter-spacing: -0.02em;
      }

      /* Mayusculas pequenas muy separadas. Es la firma tipografica del lujo:
         cuesta nada y se reconoce al instante. */
      .rotulo {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--tinta-debil);
      }

      /* El foco se marca con el acento de la division, no con el azul del
         navegador. */
      :focus-visible {
        outline: 2px solid var(--acento);
        outline-offset: 3px;
        border-radius: 10px;
      }

      ::selection {
        background: var(--acento-suave);
        color: var(--tinta);
      }

      /* La barra de desplazamiento tambien es parte del objeto. */
      * {
        scrollbar-color: var(--linea-fuerte) transparent;
        scrollbar-width: thin;
      }

      /* Nada se mueve de golpe: lo caro se abre despacio. */
      @media (prefers-reduced-motion: reduce) {
        * { transition: none !important; animation: none !important; }
      }
    </style>
  </head>
  <body>
    <!-- ==================================================================
         LO QUE SE VE MIENTRAS CARGA

         `app.js` pesa cerca de medio mega y es lo que dibuja todo. Hasta que
         termina de bajar y React monta, este div era el fondo negro y nada
         mas: en una conexion lenta la pantalla se quedaba muerta varios
         segundos, sin un solo indicio de que algo estuviera pasando.

         Esto se pinta con el HTML, antes de que exista una linea de
         JavaScript, y React lo reemplaza al montar. No hay que sincronizarlo
         con nada: si el panel arranca, desaparece solo.
         ================================================================== -->
    <div id="root">
      <div class="arranque">
        <span class="firma" style="width: 132px"></span>
        <span class="arranque-texto">Cargando</span>
      </div>
    </div>
    <noscript>
      <div class="arranque">
        <span class="arranque-texto">
          Este panel necesita JavaScript activado para funcionar.
        </span>
      </div>
    </noscript>
    <script src="app.js?v=09c6b0e78f"></script>
  </body>
</html>
