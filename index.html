         que la division ya no pinta la pantalla entera: se lee en su pastilla
         de identidad y en la franja de la cabecera —color que CODIFICA UN DATO,
         que es la unica excepcion que §4 admite—.
         ==================================================================== */

      :root {
        color-scheme: light;

        /* --- ACENTO. Luft = slate. En RGB sueltos para poder usar alpha. --- */
        --accent: 71 85 105;
        --accent-strong: 51 65 85;
        --accent-ink: 30 41 59;

        /* --- NEUTRALES. Matiz frio, nunca gris puro. --- */
        --ink: 15 23 42;
        --ink-2: 71 85 105;
        /* El tercer escalon va en slate-500 y no en slate-400: a 400 el texto
           queda en 2.6:1 sobre blanco y §4 pide 4.5:1. Mismo razonamiento, y
           mismo valor, que en el globals.css del ERP. */
        --ink-3: 100 116 139;
        --line: 226 232 240;
        --surface: 255 255 255;
        --canvas: 248 250 252;

        /* --- SEMANTICOS. Separados del acento a proposito: el acento dice de
               que app es la pantalla; estos dicen si algo esta bien o mal. --- */
        --ok: 16 185 129;     --ok-ink: 4 120 87;
        --warn: 245 158 11;   --warn-ink: 180 83 9;
        --danger: 225 29 72;  --danger-ink: 190 18 60;
        --info: 59 130 246;   --info-ink: 3 105 161;

        /* --- RADIOS --- */
        --r-sm: 8px; --r-md: 12px; --r-lg: 16px; --r-xl: 22px; --r-pill: 999px;

        /* --- SOMBRAS. Offset + blur reales, tintadas del acento. Nunca un
               halo plano de color. --- */
        --shadow-sm: 0 1px 2px rgb(15 23 42 / 0.05);
        --shadow-card: 0 1px 2px rgb(15 23 42 / 0.04), 0 18px 40px -22px rgb(var(--accent) / 0.26);
        --shadow-pop: 0 2px 4px rgb(15 23 42 / 0.06), 0 34px 64px -24px rgb(var(--accent) / 0.34);
        --ring: 0 0 0 3px rgb(var(--accent) / 0.32);

        /* --- TIPOGRAFIA ---
           El ERP declara `--font-geist-sans` y cae en la sans del sistema: no
           carga ninguna fuente por red. Se copia tal cual, y de paso resuelve
           que este panel se abre sin señal en la nave —una fuente que no baja
           es una pantalla que se dibuja dos veces—. */
        --font-geist-sans: ui-sans-serif, system-ui, -apple-system,
          BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;

        /* ================================================================
           ALIAS. Lo que piden los componentes de este panel, resuelto contra
           los tokens de arriba. Ni un color nuevo: solo otro nombre.
           ================================================================ */
        --papel: rgb(var(--canvas));
        --superficie: rgb(var(--surface));
        --superficie-alta: rgb(var(--surface));

        --tinta: rgb(var(--ink));
        --tinta-tenue: rgb(var(--ink-2));
        --tinta-debil: rgb(var(--ink-3));

        --acento: rgb(var(--accent-ink));
        --acento-relleno: rgb(var(--accent-strong));
        --acento-fuerte: rgb(var(--accent-ink));
        --acento-suave: rgb(var(--accent) / 0.12);
        --sobre-acento: #ffffff;

        --linea: rgb(var(--line));
        --linea-fuerte: rgb(var(--accent) / 0.18);

        --aprobar: rgb(var(--ok-ink));
        --rechazar: rgb(var(--danger-ink));
        --aviso-texto: rgb(var(--warn-ink));
        --aviso-fondo: rgb(var(--warn) / 0.12);
        --aviso-linea: rgb(var(--warn) / 0.28);

        --sombra-suave: var(--shadow-sm);
        --sombra-media: var(--shadow-card);

        /* La serif editorial se retira. El ERP es una sola familia tipografica
           y un titulo en Didot aqui delataria que esta pantalla viene de otro
           sitio, que es justo lo que se viene a quitar. */
        --serif: var(--font-geist-sans);
        --sans: var(--font-geist-sans);

        /* El color de la division. Ya NO pinta la pantalla: vive en la pastilla
           de identidad y en la franja de la cabecera. */
        --division-tinte: 71 85 105;
        --madera: rgb(var(--accent-ink));
      }

      /* La division solo cambia su propio distintivo. */
      :root[data-division='pvc']        { --division-tinte: 59 130 246; }
      :root[data-division='carpinteria'] { --division-tinte: 180 83 9; }

      /* El cambio de sala se hace despacio: si el color saltara de golpe se
         sentiria como un parpadeo, no como un traslado. */
      :root { transition: none; }
      body, body * {
        transition-property: color, background-color, border-color;
        transition-duration: 0.45s;
        transition-timing-function: ease;
      }

      /* ================================================================
         LA FIRMA, YA SIN METAL

         Antes el logo se pintaba en oro o en diamante y los titulos iban
         "labrados" en ese mismo degradado. Eso se va entero, y no por gusto:
         DESIGN.md §4 prohibe el gradient-text como enfasis. En el ERP el
         enfasis se hace con PESO y TAMANO, que es lo que sobrevive a una
         pantalla mala, a la impresion en blanco y negro y a quien no distingue
         bien los tonos.

      /* El PNG lleva SOLO el trazo, en blanco con transparencia. Sobre el fondo
         claro del ERP eso es invisible, asi que no se pinta: se usa de RECORTE
         y por debajo va tinta solida. El mismo archivo vale para cualquier
         color, que es justo para lo que se hizo asi. */
      .firma {
        display: block;
        aspect-ratio: 360 / 199;
        background-color: rgb(var(--accent-ink));
        -webkit-mask-image: var(--firma);
        mask-image: var(--firma);
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-position: center;
        mask-position: center;
      }

      /* La espera. Sin peso propio: son dos elementos y ninguna imagen que
         no estuviera ya en la hoja. */
      .arranque {
        min-height: 100vh;
        display: grid;
        place-items: center;
        align-content: center;
        gap: 18px;
        padding: 24px;
      }
      .arranque-texto {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: rgb(var(--ink-3));
        animation: respirar 1.9s ease-in-out infinite;
      }
      /* El latido del panel. Muy contenido: es un indicio, no una alarma. */
      @keyframes pulso {
        0%, 100% { opacity: 1;    transform: scale(1); }
        50%      { opacity: 0.35; transform: scale(0.82); }
      }

      /* La rueda de la espera. */
      @keyframes girar {
        to { transform: rotate(360deg); }
      }

      @keyframes respirar {
        0%, 100% { opacity: 0.35; }
        50%      { opacity: 0.9; }
      }

      /* Un hilo de metal, del ancho de un pelo. Es el remate de un mueble
         bueno: no se mira, se nota. */
      /* Era un hilo de metal. Ahora es lo que es: un divisor de 1 px, como
         el de cualquier cabecera del ERP. */
      .filete-metal {
        height: 1px;
        background: rgb(var(--line));
      }

      /* ---------------- La firma en la cabecera ----------------
         Junto al nombre de quien esta dentro, no flotando en una esquina. Ahi
         es donde se lee sin buscarla, y donde acompana en vez de estorbar. */
      .marca-cabecera {
        display: flex;
        align-items: center;
        gap: 11px;
        padding-left: 16px;
        border-left: 1px solid rgb(var(--line));
      }
      .marca-cabecera .firma { width: 52px; }
      .marca-cabecera .rotulo { font-size: 9.5px; letter-spacing: 0.16em; }

      @media (max-width: 720px) {
        .marca-cabecera { border-left: none; padding-left: 0; }
        .marca-cabecera .rotulo { display: none; }
      }

      * { box-sizing: border-box; }

      html, body, #root { height: 100%; }

      body {
        margin: 0;
        background-color: rgb(var(--canvas));
        color: rgb(var(--ink));
        font-family: var(--font-geist-sans);
        /* 15 px es el `body` de la escala del ERP (0.9375rem / 1.55). */
        font-size: 15px;
        line-height: 1.55;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        -webkit-tap-highlight-color: transparent;
      }

      /* El cielo del ERP. Va en una capa fija propia y no en `background` del
         body: `background-attachment: fixed` se repinta entero en cada scroll
         dentro de un WebView. Copiado del globals.css de Luft, con el acento
         slate que le toca a esta app. */
      body::before {
        content: '';
        position: fixed;
        inset: 0;
        z-index: -1;
        pointer-events: none;
        background:
          radial-gradient(820px 560px at 10% -6%, rgba(15, 23, 42, 0.11) 0%, transparent 60%),
          radial-gradient(960px 640px at 94% 2%, rgba(15, 23, 42, 0.07) 0%, transparent 58%),
          radial-gradient(900px 720px at 50% 116%, rgba(15, 23, 42, 0.09) 0%, transparent 60%),
          radial-gradient(680px 600px at -8% 64%, rgba(15, 23, 42, 0.05) 0%, transparent 64%),
          linear-gradient(180deg, #ffffff 0%, #f8fafc 52%, #eef1f5 100%);
      }

      /* Los titulos van en serif, grandes y apretados. Es la voz de la marca:
         donde antes habia una sans mas gruesa, ahora hay una letra con historia. */
      /* La escala tipografica del ERP (DESIGN.md §2): h1 1.5/1.9, h2 1.25/1.6,
         h3 1.125/1.5, tracking de titulos -0.02em. El enfasis se hace con peso,
         no con una serif editorial ni con un degradado. */
      h1, h2, h3 {
        font-family: var(--font-geist-sans);
        font-weight: 700;
        letter-spacing: -0.02em;
        text-wrap: balance;
        color: rgb(var(--ink));
      }

      h1 { font-size: 24px; line-height: 1.26; margin: 0 0 6px; }
      h2 { font-size: 20px; line-height: 1.28; margin: 0 0 4px; }
      h3 { font-size: 18px; line-height: 1.33; margin: 0; font-weight: 600; }

      /* Los titulos van labrados en el metal de la division.
         El color plano se declara ANTES: si un navegador no soporta recortar el
         fondo al texto, se queda con el color y el titulo se lee igual. Al
         reves —transparente primero— el titulo desapareceria. */
      /* Aqui vivia el titulo recortado sobre el degradado de metal. Lo quita
         DESIGN.md §4: "nada de gradient-text como enfasis". */

      /* Las cifras tambien en serif y con los digitos alineados: una columna de
         cantidades que baila se lee como una hoja de calculo cualquiera. */
      /* `.num` no la usa nadie: se quedo escrita y ninguna celda la lleva.
         Por eso las columnas de cantidades seguian con los digitos de ancho
         distinto pese a existir esta regla. Lo que de verdad lo arregla esta
         mas abajo, aplicado a `td` y `th` directamente, que es donde estan las
         cifras. Se deja aqui, sin uso, solo para que no vuelva a escribirse
         creyendo que hace algo. */
      .num { font-variant-numeric: tabular-nums; }
      .cifra {
        font-variant-numeric: tabular-nums;
        letter-spacing: -0.01em;
      }

      /* Mayusculas pequenas muy separadas. Es la firma tipografica del lujo:
         cuesta nada y se reconoce al instante. */
      /* El `caption` del ERP: 11 px, versalitas separadas, tercer escalon de
         tinta. Es tambien lo que lleva el `th` de las tablas (§3). */
      .rotulo {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: rgb(var(--ink-3));
      }

      /* El foco se marca con el acento de la division, no con el azul del
         navegador. */
      /* Foco visible SIEMPRE (§4). Es el mismo anillo del ERP. */
      :focus-visible {
        outline: 2px solid rgb(var(--accent));
        outline-offset: 2px;
      }

      ::selection {
        background: rgb(var(--accent) / 0.18);
        color: rgb(var(--ink));
      }

      /* La barra de desplazamiento tambien es parte del objeto. */
      * {
        scrollbar-color: rgb(var(--ink-3) / 0.55) transparent;
        scrollbar-width: thin;
      }

      /* ================================================================
         LAS TABLAS

         Van aqui y no en cada tabla porque son CINCO y tienen que leerse
         igual. Una regla suelta en una de ellas es como empiezan a
         parecerse solo de lejos.
         ================================================================ */

      /* Las cifras, con todos los digitos del mismo ancho.

         Sin esto, una columna de existencias con 1240, 3, 0 y 12 queda
         alineada por la derecha pero rota por dentro: el 1 ocupa menos que
         el 8 y las unidades bailan de fila en fila. Es de esas cosas que no
         se saben nombrar pero se notan; con el ancho fijo la columna se lee
         de un vistazo y las cantidades se pueden COMPARAR sin leerlas. */
      td, th, .cifra {
        font-variant-numeric: tabular-nums;
      }

      /* La fila que se esta mirando.

         Las filas son anchas -codigo, nombre, unidad, existencia, estado- y
         seguir una hasta el final sin nada que la sostenga es facil de
         perder, sobre todo en la pantalla ancha de oficina. Un realce muy
         tenue basta: 1.15:1 contra la tarjeta. Se queda ahi a proposito,
         porque lo que tiene que destacar de una tabla son los datos, no el
         raton.

         Comprobado que el texto sigue legible encima: la tinta debil -la mas
         floja de las tres- da 4.68:1 sobre la fila realzada. */
      tbody tr {
        transition: background .18s ease;
      }
      tbody tr:hover {
        background: rgb(var(--accent) / 0.04);
      }

      /* La ultima linea de un parrafo, sin una palabra sola colgando.

         Los titulos ya lo hacen con `balance` mas arriba; los parrafos no lo
         hacian, y aqui importa porque cada pantalla lleva debajo del titulo
         una frase que explica para que sirve. */
      p { text-wrap: pretty; }

      /* Nada se mueve de golpe: lo caro se abre despacio. */
      @media (prefers-reduced-motion: reduce) {
        * { transition: none !important; animation: none !important; }
      }
    </style>
  </head>
  <body>
    <!-- ==================================================================
         LO QUE SE VE MIENTRAS CARGA

         `app.js` pesa cerca de medio mega y es lo que dibuja todo. Hasta que
         termina de bajar y React monta, este div era el fondo negro y nada
         mas: en una conexion lenta la pantalla se quedaba muerta varios
         segundos, sin un solo indicio de que algo estuviera pasando.

         Esto se pinta con el HTML, antes de que exista una linea de
         JavaScript, y React lo reemplaza al montar. No hay que sincronizarlo
         con nada: si el panel arranca, desaparece solo.
         ================================================================== -->
    <div id="root">
      <div class="arranque">
        <span class="firma" style="width: 132px"></span>
        <span class="arranque-texto">Cargando</span>
      </div>
    </div>
    <noscript>
      <div class="arranque">
        <span class="arranque-texto">
          Este panel necesita JavaScript activado para funcionar.
        </span>
      </div>
    </noscript>
    <script src="app.js?v=1e4c87afe7"></script>
  </body>
</html>
